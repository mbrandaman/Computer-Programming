<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boll Studios Sign In</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #sign-button {
            border: 2px solid black;
            border-radius: 5px;
            background-color: white;
        }
        h1 {
            color: black;
        }
    </style>
</head>
<body style="background-color: grey;">
    <div id="header">
        <h1>Log In</h1>
        <nav class="nav-bar">
            <div class="nav-links">
                <a href="info.html">Info</a>
                <a href="index.html">Home</a>
                <a href="store.html">Store</a>
                <a href="signin.html" id="sign-button">Sign In</a>
            </div>
        </nav>
    </div>
    <div style="text-align: center; font-size: 1.5rem;">
        <h3>Username: </h3>
        <input id="username" type="text">
        <h3>Password: </h3>
        <input id="password" type="password">
        <br>
        <button id="sign-in" onclick="logIn()">Sign In</button>
        <br>
        <img src="Images/Blip.svg" style="width: 100px; margin-top: 50px;">
        <p class="fact">Fun Fact: There are about 4.5 million active Boll Studio accounts around the world. Add to that count by signing in!</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
